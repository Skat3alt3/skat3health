<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>kmc</title>
<style>
:root{--r:#e30613;--b:#0033a0;--y:#ffd100;--k:#000;--w:#fff}
*{box-sizing:border-box;margin:0}
body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;background:var(--w);color:var(--k);line-height:1.4}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 64px}
header{display:flex;align-items:flex-end;gap:12px;padding:24px 0 10px;border-bottom:6px solid var(--k)}
h1{font-size:88px;font-weight:700;letter-spacing:-5px;line-height:.8}
header p{font-size:14px;max-width:150px}
.sh{margin-left:auto;display:flex;gap:6px}
.sh i{width:30px;height:30px;display:block}
.sh i:nth-child(1){background:var(--r);border-radius:50%}
.sh i:nth-child(2){background:var(--b)}
.sh i:nth-child(3){background:var(--y);clip-path:polygon(50% 0,100% 100%,0 100%)}
nav{display:flex;border-bottom:6px solid var(--k);background:var(--w);position:sticky;top:0;z-index:2}
nav button{flex:1;padding:12px;font:inherit;font-weight:700;font-size:18px;background:var(--w);border:0;cursor:pointer}
nav button.on{background:var(--k);color:var(--w)}
h2{font-size:22px;margin:20px 0 8px}
.stories{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px}
.tile{flex:none;width:88px;height:88px;border:0;font:inherit;font-weight:700;font-size:13px;padding:8px;overflow:hidden;cursor:pointer;word-break:break-word;color:var(--w)}
.add{background:var(--k);font-size:44px;line-height:1}
.c0{background:var(--r);border-radius:50%}
.c1{background:var(--b)}
.c2{background:var(--y);color:var(--k);border-radius:50% 50% 0 0}
.box{border:3px solid var(--k);padding:12px;display:grid;gap:8px;margin-top:8px}
input,textarea,select{font:inherit;border:2px solid var(--k);border-radius:0;padding:10px;width:100%;background:var(--w)}
textarea{min-height:80px;resize:vertical}
.btn,.box>button,.cm button,dialog button.btn{font:inherit;font-weight:700;background:var(--k);color:var(--w);border:0;padding:11px 16px;cursor:pointer}
.btn:hover,.box>button:hover,.cm button:hover{background:var(--y);color:var(--k)}
:focus-visible{outline:4px solid var(--b);outline-offset:2px}
.p{border:3px solid var(--k);border-left-width:16px;padding:14px;margin-top:12px}
.p.book{border-left-color:var(--b)}
.p.prompt{border-left-color:var(--r)}
.p h3{font-size:22px;letter-spacing:-.5px}
.p small{display:block;margin-bottom:4px}
.p p{margin:6px 0 10px;white-space:pre-wrap}
.lnk{background:none;border:0;font:inherit;font-weight:700;text-decoration:underline;cursor:pointer;padding:0}
.cmt{border-top:2px solid var(--k);margin-top:10px;padding-top:6px}
.cmt p{margin:4px 0}
.cm{display:flex;gap:6px;margin-top:8px}
.sk{font-size:120px;font-weight:700;letter-spacing:-6px;line-height:1}
.gr{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:16px 0}
.gr b{aspect-ratio:1;border:3px solid var(--k)}
.gr b.on{background:var(--b)}
.gr b.t{border-color:var(--r)}
#rd{width:100%;font-size:22px;padding:16px}
dialog{border:6px solid var(--k);padding:18px;width:min(92vw,420px);margin:auto}
dialog form{display:grid;gap:8px}
dialog::backdrop{background:rgba(0,0,0,.7)}
#dv h2{margin-top:0}
</style></head><body><div class="wrap">
<header><h1>kmc</h1><p>Read, leave a note, pass it on.</p><div class="sh"><i></i><i></i><i></i></div></header>
<nav><button class="on" data-a="tab" data-id="feed">Feed</button><button data-a="tab" data-id="habit">Reading</button></nav>

<main id="feed">
<h2>Today's picks</h2><div class="stories" id="st"></div>
<h2>Post</h2>
<form class="box" id="cf">
<select id="pt" aria-label="Type"><option value="book">Book post</option><option value="prompt">Prompt card</option></select>
<select id="pr" aria-label="Prompt" hidden></select>
<input id="bk" placeholder="Book title" maxlength="100">
<textarea id="tx" placeholder="Write something. No name needed." maxlength="280" required></textarea>
<button>Post</button></form>
<div id="ps"></div>
</main>

<main id="habit" hidden>
<h2>Reading streak</h2><div class="sk" id="sk">0</div><p id="tot"></p>
<div class="gr" id="gr"></div>
<button class="btn" id="rd" data-a="read">I read today</button>
<p style="margin-top:12px">Saved on this device only. Nobody else sees it.</p>
</main>
</div>

<dialog id="dn"><form method="dialog" id="df"><h2>Share a pick for 24 hours</h2>
<input id="db" placeholder="Book title" maxlength="100" required>
<input id="dt" placeholder="Why, in one line" maxlength="140" required>
<button class="btn">Share</button><button class="btn" formnovalidate>Cancel</button></form></dialog>
<dialog id="dv" data-a="close"></dialog>

<script>
const API=""; // Paste your Google Apps Script web app URL here. Empty = demo mode (saves in this browser only).
const PR=["I read this for…","Start at page…","Pair it with…","Who should read this?","I underlined this because…"];
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ago=t=>{const m=(Date.now()-t)/6e4;return m<60?~~m+" min ago":m<1440?~~(m/60)+" h ago":~~(m/1440)+" d ago"};
const seed=()=>[
{id:"s1",kind:"post",ts:Date.now()-36e5,type:"prompt",book:"Ways of Seeing",text:"I read this for the essay on images. Start at chapter 1."},
{id:"s2",kind:"post",ts:Date.now()-72e5,type:"book",book:"Design of Everyday Things",text:"Pencil marks on page 40 made me read it twice."},
{id:"s3",kind:"daily",ts:Date.now()-18e5,type:"",book:"Ways of Seeing",text:"Short, and it changes how you look at ads."}];
let items=[],open=new Set();
$("#pr").innerHTML=PR.map(p=>`<option>${p}</option>`).join("");

async function load(){
 if(API){try{items=await(await fetch(API)).json()}catch(e){}}
 else items=JSON.parse(localStorage.kmc||"null")||seed();
 render()}
function add(o){
 o={id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),ts:Date.now(),type:"",book:"",parent:"",...o};
 items.push(o);render();
 if(API)fetch(API,{method:"POST",body:JSON.stringify(o)}).catch(()=>{});
 else localStorage.kmc=JSON.stringify(items)}

function render(){
 const dl=items.filter(i=>i.kind=="daily"&&Date.now()-i.ts<864e5).sort((a,b)=>b.ts-a.ts);
 $("#st").innerHTML='<button class="tile add" data-a="new" aria-label="Add a pick">+</button>'+
  dl.map((d,i)=>`<button class="tile c${i%3}" data-a="view" data-id="${esc(d.id)}">${esc(d.book)}</button>`).join("");
 const cm=items.filter(i=>i.kind=="comment");
 $("#ps").innerHTML=items.filter(i=>i.kind=="post").sort((a,b)=>b.ts-a.ts).map(p=>{
  const c=cm.filter(x=>x.parent==p.id).sort((a,b)=>a.ts-b.ts);
  const th=open.has(p.id)?`<div class="cmt">${c.map(x=>`<p>${esc(x.text)}</p>`).join("")}<form class="cm" data-id="${esc(p.id)}"><input maxlength="200" placeholder="Add a comment" required><button>Send</button></form></div>`:"";
  return `<article class="p ${p.type=="prompt"?"prompt":"book"}"><small>${p.type=="prompt"?"Prompt card":"Book"}, ${ago(p.ts)}</small><h3>${esc(p.book||"Untitled")}</h3><p>${esc(p.text)}</p><button class="lnk" data-a="cm" data-id="${esc(p.id)}">Comments (${c.length})</button>${th}</article>`}).join("")||"<p>No posts yet. Write the first one.</p>";
 habit()}

const key=d=>d.toLocaleDateString("en-CA");
const days=()=>JSON.parse(localStorage.kmcd||"[]");
function habit(){
 const s=new Set(days());let n=0,d=new Date();
 if(!s.has(key(d)))d.setDate(d.getDate()-1);
 while(s.has(key(d))){n++;d.setDate(d.getDate()-1)}
 $("#sk").textContent=n;$("#tot").textContent=s.size+" days read in total";
 let g="";for(let i=34;i>=0;i--){const x=new Date();x.setDate(x.getDate()-i);g+=`<b class="${s.has(key(x))?"on":""} ${i?"":"t"}"></b>`}
 $("#gr").innerHTML=g;$("#rd").textContent=s.has(key(new Date()))?"Read today. Tap to undo":"I read today"}

document.addEventListener("click",e=>{
 const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,id=b.dataset.id;
 if(a=="tab"){document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x==b));
  $("#feed").hidden=id!="feed";$("#habit").hidden=id!="habit"}
 if(a=="new")$("#dn").showModal();
 if(a=="close")$("#dv").close();
 if(a=="view"){const d=items.find(i=>i.id==id);$("#dv").innerHTML=`<h2>${esc(d.book)}</h2><p>${esc(d.text)}</p><p><small>${ago(d.ts)}. Tap to close.</small></p>`;$("#dv").showModal()}
 if(a=="cm"){open.has(id)?open.delete(id):open.add(id);render()}
 if(a=="read"){const k=key(new Date()),s=new Set(days());s.has(k)?s.delete(k):s.add(k);localStorage.kmcd=JSON.stringify([...s]);habit()}});

$("#pt").onchange=e=>{$("#pr").hidden=e.target.value!="prompt"};
document.addEventListener("submit",e=>{
 const f=e.target;
 if(f.id=="cf"){e.preventDefault();const pr=$("#pt").value=="prompt";
  add({kind:"post",type:pr?"prompt":"book",book:$("#bk").value.trim(),text:(pr?$("#pr").value+" ":"")+$("#tx").value.trim()});f.reset();$("#pr").hidden=true}
 if(f.id=="df"){add({kind:"daily",book:$("#db").value.trim(),text:$("#dt").value.trim()});f.reset()}
 if(f.classList.contains("cm")){e.preventDefault();const i=f.querySelector("input");add({kind:"comment",parent:f.dataset.id,text:i.value.trim()})}});
load();
</script></body></html>
